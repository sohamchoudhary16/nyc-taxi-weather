name: taxi_weather
version: "1.0.0"
config-version: 2
profile: taxi_weather

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # The timezone contract, declared once, consumed by every model.
  trip_source_tz: "America/New_York"
  reporting_tz: "America/New_York"
  min_valid_ts: "2024-01-01"
  max_valid_ts: "2024-02-01"

models:
  taxi_weather:
    +materialized: table
    bronze:
      +materialized: view
    silver:
      +materialized: table
    gold:
      +materialized: table
