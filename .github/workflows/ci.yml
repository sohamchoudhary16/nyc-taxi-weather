name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - run: ruff check src tests
      - run: PYTHONPATH=src pytest tests -q
      # dbt models are compiled against DuckDB with a synthetic fixture so CI
      # never depends on an external download or a cloud credential.
      - run: PYTHONPATH=src python -m taxi.fixtures
      - name: Create CI dbt profile
        run: |
          cat > dbt/profiles.yml << 'EOF'
          taxi_weather:
            target: ci
            outputs:
              ci:
                type: duckdb
                path: "../data/warehouse.duckdb"
                threads: 4
          EOF
      - run: cd dbt && dbt deps && dbt build --target ci
        env: {DBT_PROFILES_DIR: "."}